services:
  - type: web
    name: codetrail-api
    runtime: python
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: JWT_SECRET
        generateValue: true
      # Neon connection string, e.g. postgresql://user:pass@host/db?sslmode=require
      - key: DATABASE_URL
        sync: false
      # JSON list of allowed frontend origins, e.g. ["https://codetrail.vercel.app"]
      - key: CORS_ORIGINS
        sync: false
